<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
        
        <div id="expenseForm">
            <table id="expenseTable">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Amount ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" id="category" placeholder="Enter category"></td>
                        <td><input type="number" id="amount" placeholder="Enter amount"></td>
                        <td><button onclick="addExpense()">Add</button></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div id="expensesList">
            <h2>Current Expenses</h2>
            <table id="currentExpenses">
                <thead>
                    <tr>
                        <th>Category</th>
                        <th>Amount ($)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <button onclick="calculateExpenses()">Calculate</button>

        <div id="results" class="results" style="display: none;">
            <h2>Results</h2>
            <p>Total Expenses: $<span id="totalExpenses">0</span></p>
            <p>Average Daily Expense: $<span id="avgDailyExpense">0</span></p>
            <h3>Top 3 Largest Expenses:</h3>
            <ul id="topExpenses"></ul>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
